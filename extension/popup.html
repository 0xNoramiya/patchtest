<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PatchTest</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 300px; margin: 0; padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Ubuntu Sans", Arial, sans-serif;
        background: #fbfaf7; color: #191c1a;
      }
      h1 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
      p { margin: 8px 0 0; font-size: 12.5px; line-height: 1.5; color: #4a5159; }
      button {
        margin-top: 12px; width: 100%; padding: 9px 12px;
        border: 0; border-radius: 8px; background: #2f5d4f; color: #fff;
        font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
      }
      button.secondary { background: #fff; color: #191c1a; border: 1px solid rgba(25,28,26,0.14); }
      .status { margin-top: 12px; padding: 8px 10px; border-radius: 8px; font-size: 12px; }
      .ok { background: #edf4f0; color: #2f5d4f; }
      .warn { background: #fdf3e2; color: #8a5a14; }
      a { color: #2f5d4f; }
    </style>
  </head>
  <body>
    <h1>PatchTest</h1>
    <p>Checks the skincare in your cart against what you told PatchTest about your skin.</p>
    <div id="status" class="status warn">Checking…</div>
    <button id="check">Check this page</button>
    <button id="open" class="secondary">Open PatchTest</button>
    <p id="result"></p>
    <script src="popup.js"></script>
  </body>
</html>
