app = "patchtest"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  # Live scanning is on so judges can see a real call. The hard stop is the
  # ceiling that actually binds: with 198 units already spent it permits about 31
  # more live scans in total, ever, across every day of judging. The daily cap
  # only smooths that out so one day cannot consume the lot, and it counts
  # successful scans alone, because a rejected photo costs nothing.
  DEMO_MODE = "live"
  UNIT_BUDGET_TOTAL = "1000"
  UNIT_HARD_STOP = "900"
  LIVE_SCAN_DAILY_CAP = "5"
  HIGH_ACID_PCT = "20"

# The unit ledger and the scan cache live here so the daily cap survives
# restarts and is enforced across requests.
[[mounts]]
  source = "patchtest_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Judges test until Nov 20. One machine stays available rather than scaling to zero.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
